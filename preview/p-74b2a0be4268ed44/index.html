<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pride Transport – Home</title>
<meta name="description" content="Pride Transport: safe, comfortable bus travel from Bulawayo to Beitbridge, Binga, Nkayi, Matshetsheni and beyond. Book your seat online.">
<meta property="og:title" content="Pride Transport – Home">
<meta property="og:description" content="Pride Transport: safe, comfortable bus travel from Bulawayo to Beitbridge, Binga, Nkayi, Matshetsheni and beyond. Book your seat online.">
<link rel="icon" href="images/pt-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--fs-xs:12px;--fs-sm:13px;--fs-base:15px;--fs-lg:16px;--fs-xl:18px;--fs-2xl:21px;--fs-3xl:26px;--fs-h2:clamp(24px, 2.8vw, 32px);--fs-h1:clamp(28px, min(3.8vw, 6.5vh), 46px)}
body{margin:0;font-size:var(--fs-base);font-family: 'Plus Jakarta Sans', system-ui, sans-serif;color:#1E1E1E;background:#FFFFFF}
a{color:#1E1E1E}a:hover{color:#C8102E}
input,select{font:inherit;color:#1E1E1E}
*{box-sizing:border-box}
/* Motion: hero entrance on load, then sections and cards rise in as they scroll into view */
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes drive-in{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
.intro>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.intro>:nth-child(2){animation-delay:.08s}.intro>:nth-child(3){animation-delay:.16s}.intro>:nth-child(4){animation-delay:.24s}.intro>:nth-child(5){animation-delay:.32s}
.drive-in{animation:drive-in 1s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes drive-in-left{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes approach{from{opacity:0;transform:scale(.88) translateY(20px)}to{opacity:1;transform:none}}
.drive-in-left{animation:drive-in-left 1s .15s cubic-bezier(.2,.7,.2,1) both}
.approach{animation:approach 1s .15s cubic-bezier(.2,.7,.2,1) both}
.lift{transition:translate .25s ease,box-shadow .25s ease}
.lift:hover{translate:0 -4px;box-shadow:0 16px 32px rgba(30,30,30,.12)}
@supports (animation-timeline: view()){
.reveal,.stagger>*{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
.stagger>:nth-child(2){animation-range:entry 8% entry 63%}
.stagger>:nth-child(3){animation-range:entry 16% entry 71%}
.stagger>:nth-child(4){animation-range:entry 24% entry 79%}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1E1E1E; background: #FFFFFF">

<!-- First screen: nav, hero and perks strip fill the window -->
<div style="min-height: 100vh; display: flex; flex-direction: column">
<!-- NAV + HERO -->
<div id="top" style="position: relative; flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; top: -200px; left: -200px; width: 820px; height: 720px; background: radial-gradient(closest-side, #FDE3C8, rgba(253,227,200,0))"></div>
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 42%; height: 100%; background: #FDDCB4; border-radius: 260px 0 0 0 / 320px 0 0 0"></div>
<div aria-hidden="true" style="position: absolute; bottom: -140px; right: 26%; width: 300px; height: 300px; background: #FDDCB4; border-radius: 50%"></div>

<header style="position: relative">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1E1E1E">
<img src="images/pt-mark.png" alt="" style="height: 36px; width: auto">
<span style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: var(--fs-2xl); color: #1E1E1E; letter-spacing: 0.02em; text-transform: uppercase">Pride Transport</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; font-weight: 600; font-size: var(--fs-base)">
<a href="index.html" aria-current="page" style="color: #1E1E1E; text-decoration: none; border-bottom: 2px solid {{accent}}; padding-bottom: 4px">Home</a>
<a href="about.html" style="color: #1A1A1A; text-decoration: none">About us</a>
<a href="#routes" style="color: #1A1A1A; text-decoration: none">Destinations</a>
<a href="#fleet" style="color: #1A1A1A; text-decoration: none">Our fleet</a>
<a href="#hire" style="color: #1A1A1A; text-decoration: none">Hire a bus</a>
<a href="contact.html" style="color: #1A1A1A; text-decoration: none">Contact</a>
<a href="book.html" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 10px 18px; border-radius: 999px; font-weight: 700">Book a seat</a>
</nav>
</div>
</header>

<section style="position: relative; flex: 1; display: flex; align-items: center; padding: 4px 24px 28px">
<div style="width: 100%; max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center">
<div class="intro" style="flex: 0 1 470px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: var(--fs-lg); font-weight: 500; color: {{accent}}">The Best Way to Travel</p>
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: clamp(26px, min(3.8vw, 6vh), 46px); line-height: 1.15; letter-spacing: -0.01em; color: #111111">Book Your <span style="color: {{accent}}">Seat</span><br>Across Zimbabwe</h1>

<div id="book" style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<div style="display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center">
<label style="display: flex; align-items: center"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Trip type</span>
<select value="{{tripType}}" onChange="{{setTripType}}" style="height: 44px; border: 0; background: transparent; font-size: var(--fs-base); font-weight: 500; color: #1A1A1A; cursor: pointer">
<option value="One way">One way</option>
<option value="Return">Return</option>
</select>
</label>
<label style="display: flex; align-items: center"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Passengers</span>
<select value="{{paxStr}}" onChange="{{setPax}}" style="height: 44px; border: 0; background: transparent; font-size: var(--fs-base); font-weight: 500; color: #1A1A1A; cursor: pointer">
<option value="1">1 Adult</option><option value="2">2 Adults</option><option value="3">3 Adults</option><option value="4">4 Adults</option><option value="5">5 Adults</option><option value="6">6 Adults</option>
</select>
</label>
<label style="display: flex; align-items: center"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Departure time</span>
<select style="height: 44px; border: 0; background: transparent; font-size: var(--fs-base); font-weight: 500; color: #1A1A1A; cursor: pointer">
<option>Any time</option><option>Morning</option><option>Afternoon</option><option>Night</option>
</select>
</label>
</div>

<div style="background: {{accent}}; border-radius: 6px; padding: 10px; display: grid; grid-template-columns: 1fr 40px 1fr; gap: 8px; box-shadow: 0 10px 24px rgba(0,0,0,0.12)">
<label style="flex: 1 1 180px; min-width: 0; height: 44px; background: #FFFFFF; border-radius: 4px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: var(--fs-sm); font-weight: 700; color: #111111">From
<select value="{{from}}" onChange="{{setFrom}}" style="flex: 1; min-width: 0; height: 42px; border: 0; background: transparent; font-size: var(--fs-sm); color: #4A4A4A">
<option value="Bulawayo">Bulawayo</option><option value="Beitbridge">Beitbridge</option><option value="Binga">Binga</option><option value="Nkayi">Nkayi</option><option value="Matshetsheni">Matshetsheni</option>
</select>
</label>
<button type="button" aria-label="Swap from and to" onClick="{{swap}}" style="width: 40px; height: 44px; border: 0; border-radius: 4px; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15l-4-4M20 16H5l4 4"></path></svg>
</button>
<label style="flex: 1 1 180px; min-width: 0; height: 44px; background: #FFFFFF; border-radius: 4px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: var(--fs-sm); font-weight: 700; color: #111111">To
<select value="{{dest}}" onChange="{{setDest}}" style="flex: 1; min-width: 0; height: 42px; border: 0; background: transparent; font-size: var(--fs-sm); color: #4A4A4A">
<option value="Bulawayo">Bulawayo</option><option value="Beitbridge">Beitbridge</option><option value="Binga">Binga</option><option value="Nkayi">Nkayi</option><option value="Matshetsheni">Matshetsheni</option>
</select>
</label>
<label style="grid-column: 1 / 3; min-width: 0; height: 44px; background: #FFFFFF; border-radius: 4px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: var(--fs-sm); font-weight: 700; color: #111111">Date
<input type="date" style="flex: 1; min-width: 0; height: 42px; border: 0; background: transparent; font-size: var(--fs-sm); color: #4A4A4A">
</label>
<button type="button" onClick="{{search}}" style="height: 44px; border: 0; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: var(--fs-base); font-weight: 500; cursor: pointer">Search</button>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: var(--fs-sm); color: #1A1A1A">
<span>Popular Search</span>
<sc-for list="{{popular}}" as="pp" hint-placeholder-count="3">
<button type="button" onClick="{{pp.pick}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 2px; background: #FDE3C8; color: #1A1A1A; font: inherit; font-size: var(--fs-xs); cursor: pointer">{{pp.label}}</button>
</sc-for>
</div>

<sc-if value="{{searched}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 6px; background: #EEF7EE; color: #14532D; font-weight: 600; font-size: var(--fs-base)">
<span>{{from}} → {{dest}} · {{tripType}} · {{paxLabel}}. Buses found. Now pick your seats.</span>
<a href="#seats" style="color: #14532D; font-weight: 800">Choose seats ↓</a>
</div>
</sc-if>
</div>
</div>
<div class="drive-in" style="flex: 1 1 460px; min-width: 0; display: flex; justify-content: center">
<img src="images/bus-left-cut.png" alt="A red and white Pride Transport Irizar luxury coach" style="width: 100%; max-width: 760px; max-height: 62vh; object-fit: contain; height: auto; filter: drop-shadow(0 24px 24px rgba(0,0,0,0.18))">
</div>
</div>
</div>
</section>
</div>

<!-- PERKS STRIP -->
<section style="background: #1E1E1E; color: #FFFFFF; padding: 28px 24px">
<div style="max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px">
<div style="display: flex; align-items: center; gap: 12px"><span style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-2xl); color: #FCA5A5">24/7</span><span style="font-size: var(--fs-base); color: #E2E2E2">Departures day and night</span></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-2xl); color: #FCA5A5">Wi-Fi</span><span style="font-size: var(--fs-base); color: #E2E2E2">Free on every bus</span></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-2xl); color: #FCA5A5">USB</span><span style="font-size: var(--fs-base); color: #E2E2E2">Charge your phone</span></div>
<div style="display: flex; align-items: center; gap: 12px"><span style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-2xl); color: #FCA5A5">Safe</span><span style="font-size: var(--fs-base); color: #E2E2E2">Trained, licensed drivers</span></div>
</div>
</section>
</div>

<!-- ROUTES -->
<section id="routes" style="padding: 56px 24px; background: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<div class="reveal" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 620px">
<p style="margin: 0; font-size: var(--fs-sm); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #C8102E">Scheduled routes</p>
<h2 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-h2); line-height: 1.08; letter-spacing: -0.02em">Where are you going today?</h2>
</div>
<p style="margin: 0; max-width: 420px; font-size: var(--fs-lg); line-height: 1.6; color: #4A5568">All routes leave from Bulawayo. Pick a destination to see seats and book in under two minutes.</p>
</div>
<div class="stagger" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<sc-for list="{{routes}}" as="r" hint-placeholder-count="4">
<div class="lift" style="border: 1.5px solid #E2E8F0; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); font-weight: 700; color: #4A5568">
<span>Bulawayo</span>
<svg aria-hidden="true" width="40" height="12" viewBox="0 0 40 12" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round"><path d="M1 6h36M32 1l5 5-5 5"></path></svg>
</div>
<h3 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-3xl); letter-spacing: -0.02em">{{r.name}}</h3>
<p style="margin: 0; font-size: var(--fs-base); line-height: 1.55; color: #4A5568">{{r.note}}</p>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; border-top: 1px solid #E2E8F0">
<span style="font-size: var(--fs-base); color: #4A5568">From <strong style="color: #1E1E1E">$[FARE]</strong></span>
<a href="#book" onClick="{{r.pick}}" style="background: #1E1E1E; color: #FFFFFF; text-decoration: none; padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: var(--fs-sm)">Book this route</a>
</div>
</div>
</sc-for>
</div>
<div class="reveal" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 28px; border-radius: 20px; background: #F4F6F8">
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-2xl)">Cross-border trips</h3>
<p style="margin: 0; font-size: var(--fs-base); color: #4A5568">Going further than Zimbabwe? Ask us about regional routes.</p>
</div>
<a href="contact.html" style="color: #1E1E1E; font-weight: 800; font-size: var(--fs-base)">Ask about cross-border travel →</a>
</div>
</div>
</section>

<!-- FLEET -->
<section id="fleet" style="padding: 56px 24px; background: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px">
<div class="reveal" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.02em">Meet our fleet</h2>
<p style="margin: 0; font-size: var(--fs-lg); color: #4A5568">Choose a bus for your trip or your event.</p>
</div>
<div role="tablist" aria-label="Our buses" style="display: flex; flex-wrap: wrap; gap: 8px 36px; border-bottom: 1.5px solid #E2E8F0">
<sc-for list="{{fleet}}" as="b" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{b.on}}" onClick="{{b.pick}}" style="{{b.tabStyle}}">{{b.name}}</button>
</sc-for>
</div>
<div class="reveal" style="display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; background: #F4F6F8; border-radius: 24px; padding: 32px">
<img src="{{busImg}}" alt="{{busAlt}}" style="width: 100%; max-width: 480px; height: 240px; object-fit: contain; filter: drop-shadow(0 18px 20px rgba(0,0,0,0.18))">
<sc-if value="{{hasViews}}" hint-placeholder-val="{{ true }}">
<div role="group" aria-label="Bus views" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
<sc-for list="{{busViews}}" as="v" hint-placeholder-count="4">
<button type="button" onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="{{v.style}}">{{v.label}}</button>
</sc-for>
</div>
</sc-if>
</div>
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h3 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-3xl); letter-spacing: -0.02em">{{bus.name}}</h3>
<p style="margin: 0; font-size: var(--fs-base); font-weight: 700; color: #1E1E1E">{{bus.sub}}</p>
<p style="margin: 0; font-size: var(--fs-base); line-height: 1.65; color: #4A5568">{{bus.desc}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<span style="padding: 8px 14px; border-radius: 999px; background: #F4F6F8; font-size: var(--fs-sm); font-weight: 700">Seats: [NUMBER]</span>
<span style="padding: 8px 14px; border-radius: 999px; background: #F4F6F8; font-size: var(--fs-sm); font-weight: 700">Luggage hold underneath</span>
</div>
<ul aria-label="On board" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 24px">
<li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #C8102E">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5 12.5a10 10 0 0 1 14 0"></path><path d="M8.5 16a5 5 0 0 1 7 0"></path><circle cx="12" cy="19.5" r="1"></circle></svg>Wi-Fi</li>
<li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #C8102E">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>USB charging</li>
<li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #C8102E">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v9a2 2 0 0 0 2 2h8"></path><path d="M6 15l-1 5M16 15l2 5M10 9h6a2 2 0 0 1 2 2v4"></path></svg>Comfy seats</li>
<li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #C8102E">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 3v7M4.5 15.5l5.8-2.5M19.5 15.5l-5.8-2.5"></path></svg>Pro driver</li>
<li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #C8102E">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="13" rx="2"></rect><path d="M9 7V4h6v3M9 20v1M15 20v1"></path></svg>Luggage</li>
</ul>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 6px">
<a href="#hire" onClick="{{hireThis}}" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 800; font-size: var(--fs-base)">Hire this bus</a>
<a href="book.html" style="border: 1.5px solid #1E1E1E; color: #1E1E1E; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 800; font-size: var(--fs-base)">Book a seat</a>
</div>
</div>
</div>
</div>
</section>

<!-- HOW IT WORKS -->
<section id="how" style="padding: 56px 24px; background: #F4F6F8">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<div class="reveal" style="display: flex; flex-direction: column; gap: 12px; max-width: 640px">

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fleetIx: 0, viewIx: 0, hireBus: 'Any bus', from: 'Bulawayo', dest: 'Binga', tripType: 'One way', pax: 1, searched: false, picked: [], pay: 'EcoCash', paid: false, quoteSent: false };
  }
  togglePick(n) {
    var p = this.state.picked.slice();
    var i = p.indexOf(n);
    if (i >= 0) { p.splice(i, 1); } else { p.push(n); }
    p.sort(function (a, b) { return a - b; });
    this.setState({ picked: p, paid: false });
  }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#D7192A';
    var st = this.state;
    var taken = [3, 4, 9, 14, 15, 22, 27, 31, 38, 40];
    var seat = function (n) {
      var isTaken = taken.indexOf(n) >= 0;
      var on = st.picked.indexOf(n) >= 0;
      var base = 'width: 48px; height: 42px; border-radius: 10px 10px 6px 6px; font: inherit; font-size: var(--fs-sm); font-weight: 700; ';
      var style = isTaken
        ? base + 'background: #CBD5E0; color: #4A5568; border: 0; cursor: not-allowed'
        : on
          ? base + 'background: #1E1E1E; color: #FFFFFF; border: 0; cursor: pointer'
          : base + 'background: #FFFFFF; color: #1E1E1E; border: 1.5px solid #A0AEC0; cursor: pointer';
      return {
        num: n, taken: isTaken, on: on, style: style,
        aria: 'Seat ' + n + (isTaken ? ', taken' : on ? ', selected' : ', free'),
        pick: function () { if (!isTaken) { self.togglePick(n); } }
      };
    };
    var fleetData = [
      { name: 'Irizar Coach', sub: 'Irizar luxury long-distance coach', img: 'images/irizar-angle.png', alt: 'Red and white Pride Transport Irizar coach',
        desc: 'Our newest coach, in full Pride colours. Tinted panoramic windows, a smooth ride and plenty of luggage space make it ideal for long trips and big group bookings.',
        views: [
          { label: 'Angle', img: 'images/irizar-angle.png', alt: 'Red and white Pride Transport Irizar coach seen from the front corner' },
          { label: 'Side', img: 'images/irizar-side-right.png', alt: 'Side view of the Pride Transport Irizar coach' },
          { label: 'Front', img: 'images/irizar-front.png', alt: 'Front view of the Pride Transport Irizar coach' },
          { label: 'Rear', img: 'images/irizar-rear.png', alt: 'Rear view of the Pride Transport Irizar coach' }
        ] },
      { name: 'Red Coach', sub: 'Yutong ZK6120D1 long-distance coach', img: 'images/bus-red-cut.png', alt: 'Red and white Pride Transport Yutong coach',
        desc: 'Our red and white coach in full Pride colours. Built for long trips like Bulawayo to Beitbridge, and big groups for weddings, funerals and school trips.' },
      { name: 'Gold Coach', sub: 'Yutong coach in Pride yellow', img: 'images/bus-yellow-cut.png', alt: 'Yellow and black Pride Transport Yutong coach',
        desc: 'A bright, modern coach for daily routes to towns and rural areas, and for private hire when you want your group to travel together in comfort.' }
    ];
    var fleet = fleetData.map(function (b, i) {
      var on = st.fleetIx === i;
      return { name: b.name, on: on, pick: function () { self.setState({ fleetIx: i, viewIx: 0 }); },
        tabStyle: 'min-height: 42px; padding: 0 2px 12px; border: 0; border-bottom: 3px solid ' + (on ? accent : 'transparent') + '; margin-bottom: -1.5px; background: transparent; font: inherit; font-size: var(--fs-lg); cursor: pointer; ' + (on ? 'font-weight: 800; color: #1E1E1E' : 'font-weight: 500; color: #4A5568') };
    });
    var bus = fleetData[st.fleetIx];
    var view = bus.views ? bus.views[st.viewIx] : bus;
    var busViews = (bus.views || []).map(function (v, i) {
      var on = st.viewIx === i;
      return { label: v.label, on: on, pick: function () { self.setState({ viewIx: i }); },
        style: 'height: 34px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: var(--fs-sm); font-weight: 700; cursor: pointer; ' + (on ? 'border: 0; background: ' + accent + '; color: #FFFFFF' : 'border: 1.5px solid #D5DCE4; background: #FFFFFF; color: #1E1E1E') };
    });
    var rows = [];
    for (var r = 0; r < 11; r++) {
      var b = r * 4;
      rows.push({ left: [seat(b + 1), seat(b + 2)], right: [seat(b + 3), seat(b + 4)] });
    }
    var routeNotes = {
      Beitbridge: 'Daily buses south to the border town.',
      Binga: 'Head north-west to Binga and the shores of Kariba.',
      Nkayi: 'Regular trips to Nkayi and nearby communities.',
      Matshetsheni: 'Reliable service to Matshetsheni and surrounding areas.'
    };
    var routes = ['Beitbridge', 'Binga', 'Nkayi', 'Matshetsheni'].map(function (name) {
      return { name: name, note: routeNotes[name], pick: function () { self.setState({ from: 'Bulawayo', dest: name, searched: true }); } };
    });
    var payments = ['EcoCash', 'InnBucks', 'Card'].map(function (name) {
      var on = st.pay === name;
      return {
        name: name, on: on,
        style: 'height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: var(--fs-base); font-weight: 700; cursor: pointer; ' +
          (on ? 'background: #1E1E1E; color: #FFFFFF; border: 1.5px solid #1E1E1E' : 'background: #FFFFFF; color: #1E1E1E; border: 1.5px solid #A0AEC0'),
        pick: function () { self.setState({ pay: name }); }
      };
    });
    return {
      accent: accent,
      dest: st.dest,
      pax: st.pax,
      paxLabel: st.pax + (st.pax === 1 ? ' passenger' : ' passengers'),
      searched: st.searched,
      from: st.from,
      tripType: st.tripType,
      fleet: fleet,
      bus: bus,
      busImg: view.img,
      busAlt: view.alt,
      busViews: busViews,
      hasViews: busViews.length > 0,
      hireBus: st.hireBus,
      setHireBus: function (e) { self.setState({ hireBus: e.target.value }); },
      hireThis: function () { self.setState({ hireBus: bus.name }); },
      paxStr: String(st.pax),
      setPax: function (e) { self.setState({ pax: parseInt(e.target.value, 10) }); },
      setFrom: function (e) { self.setState({ from: e.target.value }); },
      setTripType: function (e) { self.setState({ tripType: e.target.value }); },
      swap: function () { self.setState({ from: st.dest, dest: st.from }); },
      popular: ['Binga', 'Beitbridge', 'Nkayi'].map(function (d) {
        return { label: 'Byo → ' + d, pick: function () { self.setState({ from: 'Bulawayo', dest: d, searched: true }); } };
      }),
      setDest: function (e) { self.setState({ dest: e.target.value }); },
      paxDown: function () { self.setState({ pax: Math.max(1, st.pax - 1) }); },
      paxUp: function () { self.setState({ pax: Math.min(20, st.pax + 1) }); },
      search: function () { self.setState({ searched: true }); },
      rows: rows,
      routes: routes,
      payments: payments,
      pickedText: st.picked.length ? st.picked.join(', ') : 'None yet',
      pickedCount: st.picked.length,
      paid: st.paid,
      checkout: function () { if (st.picked.length) { self.setState({ paid: true }); } },
      quoteSent: st.quoteSent,
      sendQuote: function () { self.setState({ quoteSent: true }); }
    };
  }
}
DC.mount(Component);
</script>
</body>
</html>
