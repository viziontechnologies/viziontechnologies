<style>
:root{--fs-xs:12px;--fs-sm:13px;--fs-base:15px;--fs-lg:16px;--fs-xl:18px;--fs-2xl:21px;--fs-3xl:26px;--fs-h2:clamp(24px, 2.8vw, 32px);--fs-h1:clamp(28px, min(3.8vw, 6.5vh), 46px)}
body{margin:0;font-size:var(--fs-base);font-family: 'Plus Jakarta Sans', system-ui, sans-serif;color:#1E1E1E;background:#FFFFFF}
a{color:#1E1E1E}a:hover{color:#C8102E}
*{box-sizing:border-box}
/* Motion: hero entrance on load, then sections and cards rise in as they scroll into view */
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes drive-in{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
.intro>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.intro>:nth-child(2){animation-delay:.08s}.intro>:nth-child(3){animation-delay:.16s}.intro>:nth-child(4){animation-delay:.24s}.intro>:nth-child(5){animation-delay:.32s}
.drive-in{animation:drive-in 1s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes drive-in-left{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes approach{from{opacity:0;transform:scale(.88) translateY(20px)}to{opacity:1;transform:none}}
.drive-in-left{animation:drive-in-left 1s .15s cubic-bezier(.2,.7,.2,1) both}
.approach{animation:approach 1s .15s cubic-bezier(.2,.7,.2,1) both}
.lift{transition:translate .25s ease,box-shadow .25s ease}
.lift:hover{translate:0 -4px;box-shadow:0 16px 32px rgba(30,30,30,.12)}
@supports (animation-timeline: view()){
.reveal,.stagger>*{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
.stagger>:nth-child(2){animation-range:entry 8% entry 63%}
.stagger>:nth-child(3){animation-range:entry 16% entry 71%}
.stagger>:nth-child(4){animation-range:entry 24% entry 79%}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
