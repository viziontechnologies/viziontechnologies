<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pride Transport – Book a seat</title>
<meta name="description" content="Book your Pride Transport bus seat online and pay with EcoCash, InnBucks or card.">
<meta property="og:title" content="Pride Transport – Book a seat">
<meta property="og:description" content="Book your Pride Transport bus seat online and pay with EcoCash, InnBucks or card.">
<link rel="icon" href="images/pt-mark.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--fs-xs:12px;--fs-sm:13px;--fs-base:15px;--fs-lg:16px;--fs-xl:18px;--fs-2xl:21px;--fs-3xl:26px;--fs-h2:clamp(24px, 2.8vw, 32px);--fs-h1:clamp(28px, min(3.8vw, 6.5vh), 46px)}
body{margin:0;font-size:var(--fs-base);font-family: 'Plus Jakarta Sans', system-ui, sans-serif;color:#1E1E1E;background:#F4F6F8}
a{color:#1E1E1E}a:hover{color:#C8102E}
input,select{font:inherit;color:#1E1E1E}
*{box-sizing:border-box}
/* Motion: hero entrance on load, then sections and cards rise in as they scroll into view */
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes drive-in{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
.intro>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.intro>:nth-child(2){animation-delay:.08s}.intro>:nth-child(3){animation-delay:.16s}.intro>:nth-child(4){animation-delay:.24s}.intro>:nth-child(5){animation-delay:.32s}
.drive-in{animation:drive-in 1s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes drive-in-left{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes approach{from{opacity:0;transform:scale(.88) translateY(20px)}to{opacity:1;transform:none}}
.drive-in-left{animation:drive-in-left 1s .15s cubic-bezier(.2,.7,.2,1) both}
.approach{animation:approach 1s .15s cubic-bezier(.2,.7,.2,1) both}
.lift{transition:translate .25s ease,box-shadow .25s ease}
.lift:hover{translate:0 -4px;box-shadow:0 16px 32px rgba(30,30,30,.12)}
@supports (animation-timeline: view()){
.reveal,.stagger>*{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
.stagger>:nth-child(2){animation-range:entry 8% entry 63%}
.stagger>:nth-child(3){animation-range:entry 16% entry 71%}
.stagger>:nth-child(4){animation-range:entry 24% entry 79%}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1E1E1E; background: #F4F6F8">

<!-- NAV + INTRO -->
<div style="position: relative; overflow: hidden; background: #FFFFFF">
<div aria-hidden="true" style="position: absolute; top: -200px; left: -200px; width: 820px; height: 720px; background: radial-gradient(closest-side, #FDE3C8, rgba(253,227,200,0))"></div>
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 40%; height: 100%; background: #FDDCB4; border-radius: 260px 0 0 0 / 320px 0 0 0"></div>
<header style="position: relative">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1E1E1E">
<img src="images/pt-mark.png" alt="" style="height: 36px; width: auto">
<span style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: var(--fs-2xl); color: #1E1E1E; letter-spacing: 0.02em; text-transform: uppercase">Pride Transport</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; font-weight: 600; font-size: var(--fs-base)">
<a href="index.html" style="color: #1A1A1A; text-decoration: none">Home</a>
<a href="about.html" style="color: #1A1A1A; text-decoration: none">About us</a>
<a href="index.html#routes" style="color: #1A1A1A; text-decoration: none">Destinations</a>
<a href="index.html#fleet" style="color: #1A1A1A; text-decoration: none">Our fleet</a>
<a href="index.html#hire" style="color: #1A1A1A; text-decoration: none">Hire a bus</a>
<a href="contact.html" style="color: #1A1A1A; text-decoration: none">Contact</a>
<a href="book.html" aria-current="page" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 10px 18px; border-radius: 999px; font-weight: 700">Book a seat</a>
</nav>
</div>
</header>
<section style="position: relative; padding: 8px 24px 36px">
<div style="max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px; align-items: center">
<div class="intro" style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: var(--fs-sm); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}">Online booking</p>
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-h1); letter-spacing: -0.02em; line-height: 1.1; color: #111111">Book your <span style="color: {{accent}}">seat</span></h1>
<p style="margin: 0; font-size: var(--fs-lg); color: #4A5568">Four quick steps. Your ticket comes straight to your phone.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px">
<span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; font-weight: 600; font-size: var(--fs-sm); box-shadow: 0 4px 12px rgba(30,30,30,0.06)">EcoCash, InnBucks or card</span>
<span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; font-weight: 600; font-size: var(--fs-sm); box-shadow: 0 4px 12px rgba(30,30,30,0.06)">Ticket on WhatsApp</span>
<span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; font-weight: 600; font-size: var(--fs-sm); box-shadow: 0 4px 12px rgba(30,30,30,0.06)">Pick your own seat</span>
</div>
</div>
<div class="drive-in-left" style="flex: 1 1 320px; min-width: 0; display: flex; justify-content: center"><img src="images/irizar-side-right.png" alt="Side view of a red and white Pride Transport Irizar coach" style="width: 100%; max-width: 520px; max-height: 30vh; object-fit: contain; height: auto; filter: drop-shadow(0 18px 20px rgba(0,0,0,0.18))"></div>
</div>
</section>
</div>

<section style="padding: 28px 24px 56px">
<div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<!-- STEPPER -->
<ol aria-label="Booking steps" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
<li style="{{st.style}}"><span style="{{st.dot}}">{{st.n}}</span>{{st.label}}</li>
</sc-for>
</ol>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<!-- MAIN PANEL -->
<div style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 24px">

<sc-if value="{{isTrip}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-size: var(--fs-2xl); font-weight: 800">Where are you going?</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #4A5568">From
<span style="height: 44px; border: 1.5px solid #D5DCE4; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; font-size: var(--fs-base); font-weight: 600; color: #1E1E1E; background: #F4F6F8">Bulawayo</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #4A5568">To
<select value="{{dest}}" onChange="{{setDest}}" style="height: 44px; border: 1.5px solid #D5DCE4; border-radius: 12px; padding: 0 12px; font-size: var(--fs-base); font-weight: 600; background: #FFFFFF">
<option value="Beitbridge">Beitbridge</option>
<option value="Binga">Binga</option>
<option value="Nkayi">Nkayi</option>
<option value="Matshetsheni">Matshetsheni</option>
</select>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #4A5568">Travel date
<input type="date" style="height: 44px; border: 1.5px solid #D5DCE4; border-radius: 12px; padding: 0 12px; font-size: var(--fs-base); font-weight: 600">
</label>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #4A5568">Passengers
<div style="height: 44px; border: 1.5px solid #D5DCE4; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<button type="button" aria-label="Fewer passengers" onClick="{{paxDown}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #F4F6F8; font-size: var(--fs-xl); font-weight: 700; cursor: pointer; color: #1E1E1E">−</button>
<span style="font-size: var(--fs-base); font-weight: 700; color: #1E1E1E">{{pax}}</span>
<button type="button" aria-label="More passengers" onClick="{{paxUp}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #F4F6F8; font-size: var(--fs-xl); font-weight: 700; cursor: pointer; color: #1E1E1E">+</button>
</div>
</div>
</div>
<button type="button" onClick="{{toSeats}}" style="align-self: flex-start; height: 44px; padding: 0 32px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: var(--fs-lg); font-weight: 800; cursor: pointer">Continue to seats</button>
</div>
</sc-if>

<sc-if value="{{isSeats}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: var(--fs-2xl); font-weight: 800">Pick {{paxLabel}}</h2>
<p style="margin: 0; font-size: var(--fs-base); line-height: 1.6; color: #4A5568">Tap a free seat to choose it. You have picked {{pickedCount}} of {{pax}}.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: var(--fs-xs); font-weight: 600; color: #4A5568">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FFFFFF; border: 1.5px solid #A0AEC0"></span>Free</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #1E1E1E"></span>Yours</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #CBD5E0"></span>Taken</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 8px">
<button type="button" onClick="{{toTrip}}" style="height: 42px; padding: 0 22px; border: 1.5px solid #A0AEC0; border-radius: 14px; background: #FFFFFF; font-size: var(--fs-base); font-weight: 700; cursor: pointer; color: #1E1E1E">Back</button>
<button type="button" onClick="{{toDetails}}" style="height: 42px; padding: 0 26px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: var(--fs-base); font-weight: 800; cursor: pointer">Continue</button>
</div>
<sc-if value="{{seatWarn}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: var(--fs-sm); font-weight: 600; color: #9A3412">Please pick {{pax}} seat(s) to continue.</p>
</sc-if>
</div>
<div style="flex: 0 1 auto; background: #F4F6F8; border-radius: 32px 32px 20px 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px; border: 1.5px solid #E2E8F0">
<div style="padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1.5px dashed #CBD5E0; font-size: var(--fs-xs); font-weight: 700; color: #4A5568">Front of bus</div>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="11">
<div style="display: flex; align-items: center; gap: 8px">
<sc-for list="{{row.left}}" as="s" hint-placeholder-count="2">
<button type="button" onClick="{{s.pick}}" disabled="{{s.taken}}" aria-label="{{s.aria}}" aria-pressed="{{s.on}}" style="{{s.style}}">{{s.num}}</button>
</sc-for>
<span style="width: 24px"></span>
<sc-for list="{{row.right}}" as="s" hint-placeholder-count="2">
<button type="button" onClick="{{s.pick}}" disabled="{{s.taken}}" aria-label="{{s.aria}}" aria-pressed="{{s.on}}" style="{{s.style}}">{{s.num}}</button>
</sc-for>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isDetails}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font-size: var(--fs-2xl); font-weight: 800">Your details and payment</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #4A5568">Full name
<input type="text" placeholder="e.g. Tendai Moyo" style="height: 44px; border: 1.5px solid #D5DCE4; border-radius: 12px; padding: 0 14px; font-size: var(--fs-base)">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: #4A5568">WhatsApp number (for your ticket)
<input type="tel" placeholder="077 000 0000" style="height: 44px; border: 1.5px solid #D5DCE4; border-radius: 12px; padding: 0 14px; font-size: var(--fs-base)">
</label>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: var(--fs-xs); font-weight: 700; color: #4A5568">Pay with</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<sc-for list="{{payments}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="{{p.style}}"><strong style="font-size: var(--fs-lg)">{{p.name}}</strong><span style="font-size: var(--fs-xs); font-weight: 500">{{p.hint}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" onClick="{{toSeats}}" style="height: 44px; padding: 0 22px; border: 1.5px solid #A0AEC0; border-radius: 14px; background: #FFFFFF; font-size: var(--fs-base); font-weight: 700; cursor: pointer; color: #1E1E1E">Back</button>
<button type="button" onClick="{{pay}}" style="height: 44px; padding: 0 32px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: var(--fs-lg); font-weight: 800; cursor: pointer">Pay with {{payName}}</button>
</div>
</div>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: center">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: flex-start; padding: 8px 14px; border-radius: 999px; background: #EEF7EE; color: #14532D; font-weight: 800; font-size: var(--fs-sm)">Payment received</span>
<h2 style="margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: var(--fs-3xl); font-weight: 800; letter-spacing: -0.02em">You are booked!</h2>
<p style="margin: 0; font-size: var(--fs-base); line-height: 1.6; color: #4A5568">Your ticket has been sent to your WhatsApp. Show the QR code to the conductor when you board.</p>
<button type="button" onClick="{{restart}}" style="align-self: flex-start; height: 42px; padding: 0 22px; border: 1.5px solid #A0AEC0; border-radius: 14px; background: #FFFFFF; font-size: var(--fs-base); font-weight: 700; cursor: pointer; color: #1E1E1E">Book another trip</button>
</div>
<div style="flex: 0 1 300px; border-radius: 22px; background: #1E1E1E; color: #FFFFFF; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: var(--fs-lg)">Pride Transport</strong><span style="font-size: var(--fs-xs); font-weight: 700; color: #FCA5A5">E-TICKET</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: var(--fs-xs); color: #A8A8A8">From</span><strong>Bulawayo</strong></div><div style="display: flex; flex-direction: column; gap: 2px; text-align: right"><span style="font-size: var(--fs-xs); color: #A8A8A8">To</span><strong>{{dest}}</strong></div></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: var(--fs-xs); color: #A8A8A8">Seat(s)</span><strong>{{pickedText}}</strong></div><div style="display: flex; flex-direction: column; gap: 2px; text-align: right"><span style="font-size: var(--fs-xs); color: #A8A8A8">Paid with</span><strong>{{payName}}</strong></div></div>
<div style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; justify-content: center">
<svg role="img" aria-label="Ticket QR code (sample)" width="140" height="140" viewBox="0 0 7 7" shape-rendering="crispEdges"><rect width="7" height="7" fill="#FFFFFF"></rect><path fill="#1E1E1E" d="M0 0h3v3H0zM4 0h3v3H4zM0 4h3v3H0zM1 1h1v1H1zM5 1h1v1H5zM1 5h1v1H1zM3 3h1v1H3zM4 4h1v1H4zM6 4h1v1H6zM5 5h1v1H5zM4 6h1v1H4zM6 6h1v1H6zM3 1h1v1H3zM3 5h1v1H3z"></path><path fill="#FFFFFF" d="M0.33 0.33h2.34v2.34H0.33zM4.33 0.33h2.34v2.34H4.33zM0.33 4.33h2.34v2.34H0.33z"></path><path fill="#1E1E1E" d="M0.8 0.8h1.4v1.4H0.8zM4.8 0.8h1.4v1.4H4.8zM0.8 4.8h1.4v1.4H0.8z"></path></svg>
</div>
</div>
</div>
</sc-if>
</div>

<!-- SUMMARY -->
<aside aria-label="Trip summary" style="flex: 1 1 280px; min-width: 0; background: #1E1E1E; color: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: var(--fs-xl); font-weight: 800">Your trip</h2>
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-base)"><span style="color: #A8A8A8">Route</span><strong>Bulawayo → {{dest}}</strong></div>
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-base)"><span style="color: #A8A8A8">Passengers</span><strong>{{pax}}</strong></div>
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-base)"><span style="color: #A8A8A8">Seats</span><strong>{{pickedText}}</strong></div>
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-base); padding-top: 16px; border-top: 1px solid #3D3D3D"><span style="color: #A8A8A8">Total</span><strong style="color: #FCA5A5">{{pax}} × $[FARE]</strong></div>
<p style="margin: 0; font-size: var(--fs-xs); line-height: 1.6; color: #A8A8A8">On board: free Wi-Fi, USB charging and comfortable seats.</p>
</aside>
</div>
</div>
</section>

<footer style="background: #1E1E1E; color: #FFFFFF; padding: 72px 24px 32px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 28px">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 14px; max-width: 420px">
<span style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: var(--fs-3xl); letter-spacing: -0.02em">We take you there <span style="color: #FCA5A5">with pride.</span></span>
<p style="margin: 0; font-size: var(--fs-base); line-height: 1.6; color: #CFCFCF">Bus company based in Bulawayo, running scheduled routes and private hire across Zimbabwe.</p>
</div>
<div style="flex: 0 1 260px; display: flex; flex-direction: column; gap: 10px; font-size: var(--fs-base)">
<strong style="font-size: var(--fs-sm); letter-spacing: 0.08em; text-transform: uppercase; color: #A8A8A8">Visit us</strong>
<span style="line-height: 1.6; color: #E2E2E2">Office 16, Frampton House<br>6th Avenue &amp; Herbert Chitepo<br>Bulawayo</span>
</div>
<div style="flex: 0 1 260px; display: flex; flex-direction: column; gap: 10px; font-size: var(--fs-base)">
<strong style="font-size: var(--fs-sm); letter-spacing: 0.08em; text-transform: uppercase; color: #A8A8A8">Talk to us</strong>
<a href="tel:+263771638303" style="color: #E2E2E2; text-decoration: none">077 163 8303</a>
<a href="mailto:pridenkomo86@gmail.com" style="color: #E2E2E2; text-decoration: none">pridenkomo86@gmail.com</a>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, dest: 'Binga', pax: 1, picked: [], pay: 'EcoCash', seatWarn: false };
  }
  togglePick(n) {
    var p = this.state.picked.slice();
    var i = p.indexOf(n);
    if (i >= 0) { p.splice(i, 1); }
    else if (p.length < this.state.pax) { p.push(n); }
    else { p.shift(); p.push(n); }
    p.sort(function (a, b) { return a - b; });
    this.setState({ picked: p, seatWarn: false });
  }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#D7192A';
    var st = this.state;
    var taken = [3, 4, 9, 14, 15, 22, 27, 31, 38, 40];
    var seat = function (n) {
      var isTaken = taken.indexOf(n) >= 0;
      var on = st.picked.indexOf(n) >= 0;
      var base = 'width: 46px; height: 46px; border-radius: 10px 10px 6px 6px; font: inherit; font-size: var(--fs-sm); font-weight: 700; ';
      var style = isTaken
        ? base + 'background: #CBD5E0; color: #4A5568; border: 0; cursor: not-allowed'
        : on
          ? base + 'background: #1E1E1E; color: #FFFFFF; border: 0; cursor: pointer'
          : base + 'background: #FFFFFF; color: #1E1E1E; border: 1.5px solid #A0AEC0; cursor: pointer';
      return {
        num: n, taken: isTaken, on: on, style: style,
        aria: 'Seat ' + n + (isTaken ? ', taken' : on ? ', selected' : ', free'),
        pick: function () { if (!isTaken) { self.togglePick(n); } }
      };
    };
    var rows = [];
    for (var r = 0; r < 11; r++) {
      var b = r * 4;
      rows.push({ left: [seat(b + 1), seat(b + 2)], right: [seat(b + 3), seat(b + 4)] });
    }
    var labels = ['Trip', 'Seats', 'Details & payment', 'Ticket'];
    var steps = labels.map(function (label, i) {
      var done = i < st.step, cur = i === st.step;
      return {
        n: done ? '✓' : String(i + 1), label: label,
        style: 'display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; font-size: var(--fs-base); font-weight: 700; ' +
          (cur ? 'background: #1E1E1E; color: #FFFFFF' : 'background: #FFFFFF; color: ' + (done ? '#1E1E1E' : '#4A5568')),
        dot: 'width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: var(--fs-xs); font-weight: 800; ' +
          (cur ? 'background: ' + accent + '; color: #FFFFFF' : done ? 'background: #1E1E1E; color: #FFFFFF' : 'background: #E2E8F0; color: #4A5568')
      };
    });
    var hints = { EcoCash: 'Pay from your Econet line', InnBucks: 'Pay with your InnBucks wallet', Card: 'Visa or Mastercard' };
    var payments = ['EcoCash', 'InnBucks', 'Card'].map(function (name) {
      var on = st.pay === name;
      return {
        name: name, hint: hints[name], on: on,
        style: 'min-height: 76px; padding: 14px 16px; border-radius: 14px; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; ' +
          (on ? 'background: #1E1E1E; color: #FFFFFF; border: 2px solid #1E1E1E' : 'background: #FFFFFF; color: #1E1E1E; border: 1.5px solid #A0AEC0'),
        pick: function () { self.setState({ pay: name }); }
      };
    });
    return {
      accent: accent,
      steps: steps,
      isTrip: st.step === 0, isSeats: st.step === 1, isDetails: st.step === 2, isDone: st.step === 3,
      dest: st.dest, pax: st.pax,
      paxLabel: st.pax === 1 ? '1 seat' : st.pax + ' seats',
      setDest: function (e) { self.setState({ dest: e.target.value }); },
      paxDown: function () { var n = Math.max(1, st.pax - 1); self.setState({ pax: n, picked: st.picked.slice(0, n) }); },
      paxUp: function () { self.setState({ pax: Math.min(10, st.pax + 1) }); },
      rows: rows,
      pickedCount: st.picked.length,
      pickedText: st.picked.length ? st.picked.join(', ') : '–',
      seatWarn: st.seatWarn,
      payments: payments, payName: st.pay,
      toTrip: function () { self.setState({ step: 0 }); },
      toSeats: function () { self.setState({ step: 1 }); },
      toDetails: function () { if (st.picked.length === st.pax) { self.setState({ step: 2 }); } else { self.setState({ seatWarn: true }); } },
      pay: function () { self.setState({ step: 3 }); },
      restart: function () { self.setState({ step: 0, picked: [], seatWarn: false }); }
    };
  }
}
DC.mount(Component);
</script>
